<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 项目看板</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border-radius:20px;padding:36px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  h1{margin:0 0 8px;font-size:22px;color:#1f2937;text-align:center}
  .sub{color:#6b7280;font-size:13px;text-align:center;margin:0 0 24px}
  .card{display:flex;align-items:center;padding:14px;margin:10px 0;background:#f9fafb;border-radius:12px;text-decoration:none;color:inherit;border:2px solid transparent;transition:all .2s}
  .card:hover,.card:active{border-color:#667eea;transform:translateX(4px)}
  .icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:14px;flex-shrink:0;color:#fff;font-weight:bold}
  .icon.idx{background:linear-gradient(135deg,#667eea,#764ba2)}
  .icon.sys{background:linear-gradient(135deg,#f093fb,#f5576c)}
  .icon.skl{background:linear-gradient(135deg,#4facfe,#00f2fe)}
  .info{flex:1;min-width:0}
  .info h3{margin:0 0 2px;font-size:15px;color:#1f2937}
  .info p{margin:0;color:#6b7280;font-size:11px}
  .arrow{color:#9ca3af;font-size:18px}
  .footer{margin-top:20px;text-align:center;font-size:11px;color:#9ca3af}

  /* ========== 密码门 ========== */
  .gate{position:fixed;inset:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
  .gate-box{background:#fff;border-radius:20px;padding:40px;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
  .gate-box h2{margin:0 0 8px;font-size:20px;color:#1f2937}
  .gate-box .hint{color:#6b7280;font-size:12px;margin:0 0 20px}
  .pw-input{width:100%;padding:14px;font-size:18px;border:2px solid #e5e7eb;border-radius:10px;text-align:center;letter-spacing:8px;font-weight:bold;outline:none;transition:border .2s}
  .pw-input:focus{border-color:#667eea}
  .pw-input.error{border-color:#ef4444;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pw-btn{width:100%;margin-top:14px;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
  .pw-btn:active{opacity:.85}
  .pw-msg{color:#ef4444;font-size:12px;margin-top:10px;min-height:16px}
  .lock-icon{font-size:36px;margin-bottom:12px}
</style>
</head>
<body>

<!-- ========== 密码门 ========== -->
<div id="gate" class="gate">
  <div class="gate-box">
    <div class="lock-icon">🔒</div>
    <h2>AI 项目看板</h2>
    <p class="hint">请输入 6 位访问密码</p>
    <input id="pw" class="pw-input" type="password" inputmode="numeric" maxlength="6" placeholder="******" autocomplete="off">
    <button id="pwBtn" class="pw-btn">进入</button>
    <div id="pwMsg" class="pw-msg"></div>
  </div>
</div>

<div class="box">
  <h1>AI 项目看板</h1>
  <p class="sub">点击下方卡片访问对应看板</p>

  <a class="card" href="dashboard.html">
    <div class="icon idx">主</div>
    <div class="info">
      <h3>主引导看板</h3>
      <p>9 大模块 + Token 图表</p>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="card" href="ai-system.html">
    <div class="icon sys">AI</div>
    <div class="info">
      <h3>AI 个人效能系统</h3>
      <p>5 层架构 + 项目进度</p>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="card" href="skills.html">
    <div class="icon skl">Sk</div>
    <div class="info">
      <h3>Skill 库可视化</h3>
      <p>17 个 Skill 怎么用</p>
    </div>
    <div class="arrow">→</div>
  </a>

  <p class="footer">2026-08-09 · 部署于腾讯云 CloudBase · 受密码保护</p>
</div>

<script>
// 密码 "770880" 的 SHA-256 哈希（前端比对，不存明文）
const PW_HASH = '84eee289aaed0156541b079cd0cff292211a21339796f47c58e17f2c93d3b07a';

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const pwInput = document.getElementById('pw');
const pwBtn = document.getElementById('pwBtn');
const pwMsg = document.getElementById('pwMsg');
const gate = document.getElementById('gate');

// 已通过认证则直接跳过密码门（同一会话有效）
if(sessionStorage.getItem('aiboard_auth')==='1'){
  gate.style.display='none';
}

async function checkPw(){
  const v = pwInput.value.trim();
  if(v.length!==6){
    pwMsg.textContent='请输入 6 位密码';
    pwInput.classList.add('error');
    setTimeout(()=>pwInput.classList.remove('error'),400);
    return;
  }
  const h = await sha256(v);
  if(h === PW_HASH){
    sessionStorage.setItem('aiboard_auth','1');
    gate.style.display='none';
    pwInput.value='';
    pwMsg.textContent='';
  } else {
    pwMsg.textContent='密码错误';
    pwInput.classList.add('error');
    setTimeout(()=>pwInput.classList.remove('error'),400);
    pwInput.value='';
    pwInput.focus();
  }
}

pwBtn.addEventListener('click', checkPw);
pwInput.addEventListener('keypress', e=>{ if(e.key==='Enter') checkPw(); });
pwInput.focus();
</script>
</body>
</html>
